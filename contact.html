<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | Kairos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header, navigation and login window are added by js/main.js -->
  <div id="site-header"></div>

  <main>
    <section class="page-title"><div class="container"><h1>Contact Us</h1></div></section>
    <section class="section">
      <div class="container two-col">
        <div>
          <h2>Get in touch</h2>
          <p><strong>Address</strong><br>Building 7, 48 Oak Ave<br>Highveld Techno Park<br>Centurion, 0169</p>
          <p><strong>Phone</strong><br><a href="tel:+27117928558">011 792 8558</a></p>
          <h3>Hours</h3>
          <table class="hours">
            <tbody>
              <tr><th scope="row">Monday to Friday</th><td>8 am–5 pm</td></tr>
              <tr><th scope="row">Saturday</th><td>Closed</td></tr>
              <tr><th scope="row">Sunday</th><td>Closed</td></tr>
            </tbody>
          </table>
        </div>
        <!-- This form opens the visitor's email program. No server is needed. -->
        <form id="contact-form" class="form">
          <label>Name <input name="name" required></label>
          <label>Email <input type="email" name="email" required></label>
          <label>Message <textarea name="message" rows="5" required></textarea></label>
          <button class="btn btn-accent" type="submit">Send message</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">&copy; <span id="year"></span> Kairos. All rights reserved.</div>
  </footer>

  <script src="js/login.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
