<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | Company Name</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header, navigation and login window are added by js/main.js -->
  <div id="site-header"></div>

  <main>
    <section class="page-title"><div class="container"><h1>Contact Us</h1></div></section>
    <section class="section">
      <div class="container two-col">
        <div>
          <h2>Get in touch</h2>
          <p>Email: info@yourcompany.com<br>Phone: +27 00 000 0000<br>Address: Street, City, Country</p>
        </div>
        <!-- This form opens the visitor's email program. No server is needed. -->
        <form id="contact-form" class="form">
          <label>Name <input name="name" required></label>
          <label>Email <input type="email" name="email" required></label>
          <label>Message <textarea name="message" rows="5" required></textarea></label>
          <button class="btn btn-accent" type="submit">Send message</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">&copy; <span id="year"></span> Company Name. All rights reserved.</div>
  </footer>

  <script src="js/login.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
